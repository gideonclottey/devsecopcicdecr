name: Deploy to ECR

"on":
  push:
    branches:
      - main

jobs:
    deploy:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout code
          uses: actions/checkout@v7

        - name: Configure AWS credentials
          uses: aws-actions/configure-aws-credentials@v6.3.0
          with:
            aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            aws-region: ${{ secrets.AWS_REGION }}

        - name: Log in to Amazon ECR
          id: login-ecr
          uses: aws-actions/amazon-ecr-login@v2

        - name: Build, tag, and push image to Amazon ECR
          env:
            ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_URI }}
            IMAGE_TAG: latest
          run: |
            docker build -t $ECR_REPOSITORY:$IMAGE_TAG .
            docker push $ECR_REPOSITORY:$IMAGE_TAG

        - name: Update ECS service
          env:
            CLUSTER_NAME: ${{ secrets.ECS_CLUSTER_NAME }}
            SERVICE_NAME: ${{ secrets.ECS_SERVICE_NAME }}
            IMAGE_URI: ${{ secrets.ECR_REPOSITORY_URI }}:latest
          run: |
            aws ecs update-service --cluster $CLUSTER_NAME --service $SERVICE_NAME --force-new-deployment --image $IMAGE_URI
 